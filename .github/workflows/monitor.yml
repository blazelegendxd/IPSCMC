name: IPSCMC Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipsmc-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update server status
        run: python3 scripts/monitor.py

      - name: Save status
        run: |
          git config user.name "IPSCMC Status Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json data/history.json

          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi

          git commit -m "Update IPSCMC status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
