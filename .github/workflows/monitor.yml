name: IPSCMC Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update server status
        run: python3 scripts/monitor.py

      - name: Save status
        run: |
          git config user.name "IPSCMC Status Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json data/history.json
          git diff --cached --quiet || git commit -m "Update IPSCMC status"
          git push
